sonar.projectKey=machado
sonar.projectName=Machado
sonar.sourceEncoding=UTF-8

sonar.sources=machado-api/app,machado-web/app
sonar.tests=machado-api/tests,machado-web/app,machado-web/e2e

sonar.python.version=3.13
sonar.python.coverage.reportPaths=machado-api/coverage.xml

sonar.javascript.lcov.reportPaths=machado-web/coverage/lcov.info
sonar.typescript.tsconfigPath=machado-web/tsconfig.json

sonar.exclusions=**/.next/**,**/.swc/**,**/node_modules/**,**/coverage/**,**/htmlcov/**,**/.pytest_cache/**,**/.ruff_cache/**,**/__pycache__/**,**/dist/**,**/build/**,**/playwright-report/**,**/test-results/**,**/e2e/__screenshots__/**,**/migrations/**,**/.venv/**,**/.idea/**
sonar.coverage.exclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/tests/**,**/e2e/**,**/*.config.ts,**/*.config.mjs,**/next.config.ts,**/jest.config.ts,**/playwright.config.ts,**/migrations/**
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/tests/**/*.py,**/e2e/**/*.ts
